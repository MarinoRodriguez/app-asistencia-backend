services:
  api:
    build:
      context: .
      dockerfile: AssistantApp.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      DISABLE_HTTPS_REDIRECT: "true"
      ConnectionStrings__Default: "Data Source=/app/DefaultData/asistencia.db"
    volumes:
      - api-data:/app/DefaultData

  frontend:
    build:
      context: ./CodexClient/app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8080"
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  api-data:
